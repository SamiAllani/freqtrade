{{/* Optional dev-only Secret. Production: pre-create `existingSecret` out of band. */}}
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.existingSecret.name }}
  labels:
    {{- include "freqtrade-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.existingSecret.keys.binanceKey }}: {{ .Values.secret.data.BINANCE_API_KEY | quote }}
  {{ .Values.existingSecret.keys.binanceSecret }}: {{ .Values.secret.data.BINANCE_API_SECRET | quote }}
  {{ .Values.existingSecret.keys.apiUsername }}: {{ .Values.secret.data.FT_API_USERNAME | quote }}
  {{ .Values.existingSecret.keys.apiPassword }}: {{ .Values.secret.data.FT_API_PASSWORD | quote }}
{{- end }}
