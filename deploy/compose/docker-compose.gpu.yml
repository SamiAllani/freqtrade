# GPU override for the inference gateway (Task 4). Opt-in; the base CPU stack
# needs no GPU. Requires the NVIDIA Container Toolkit on the host
# (https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html).
#
# Usage (from the repo root):
#   docker compose -f deploy/compose/docker-compose.yml \
#                  -f deploy/compose/docker-compose.gpu.yml up --build
#
# Then `GET http://0.0.0.0:8000/healthz` reports `"gpu": true` on an
# NVIDIA host. This override switches inference to the CUDA-based image and
# reserves a GPU for it. For PyTorch *FreqAI* models the freqtrade service
# needs a GPU too — see docker-compose.freqai-gpu.yml (separate override).

services:
  inference:
    build:
      context: ../..
      dockerfile: inference/Dockerfile.gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
