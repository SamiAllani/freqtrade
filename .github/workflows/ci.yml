# Task 10 CI: lint, unit tests, helm, compose, image builds, secret scan,
# FreqAI smoke test and dry-run verification. Green on a fresh clone.
name: ci

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install lint tools
        run: pip install "ruff>=0.4.0" "mypy>=1.10" "pydantic>=2.0" "pyyaml>=6.0"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        # Mirrors the repo's own tooling (Makefile `lint`, pre-commit):
        # `mypy common` plus the ftctl package and the Task 10 additions.
        run: mypy common ftctl scripts/verify_dryrun.py tests/test_safety.py tests/e2e/test_stack_dryrun.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install package with test extras
        run: pip install -e ".[dev,ftctl,gateway,mcp]"
      - name: Unit + safety + in-process e2e tests
        run: pytest -q
      - name: Dry-run verification script
        run: python scripts/verify_dryrun.py

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: latest
      - name: Helm lint
        run: helm lint deploy/helm
      - name: Helm template (default CPU dry-run values)
        run: helm template freqtrade-ai ./deploy/helm
      - name: Helm template (GPU values)
        run: >
          helm template freqtrade-ai ./deploy/helm
          --set inference.gpu.enabled=true
          --set freqtrade.gpu.enabled=true | grep -q "nvidia.com/gpu"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker compose config validates
        run: docker compose -f deploy/compose/docker-compose.yml config
      - name: Compose binds localhost only
        run: >
          docker compose -f deploy/compose/docker-compose.yml config
          | grep -q "127.0.0.1" &&
          ! docker compose -f deploy/compose/docker-compose.yml config
          | grep -q "0.0.0.0:8080"

  builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build freqtrade image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: freqtrade/Dockerfile
          push: false
          tags: freqtrade-ai-freqtrade:ci
      - name: Build inference (CPU) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: inference/Dockerfile
          push: false
          tags: freqtrade-ai-inference:ci
      - name: Build mcp-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp_server/Dockerfile
          push: false
          tags: freqtrade-ai-mcp-server:ci
      - name: Build freqtrade-exporter image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: monitoring/Dockerfile
          push: false
          tags: freqtrade-ai-freqtrade-exporter:ci

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, fallback to pattern grep)
        run: |
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --no-git --verbose --redact
          else
            echo "gitleaks not installed; running pattern fallback scan"
            # 1. No tracked env file may opt into live trading.
            ! grep -rn --exclude-dir=.git --include="*.env*" --include=".env" \
              -E "^[[:space:]]*(export[[:space:]]+)?FT_ALLOW_LIVE=[[:space:]]*yes([[:space:]]|$|#)" . \
              | grep -v "\.example" || (echo "live opt-in found in a tracked env file" && exit 1)
            # 2. No key material in tracked files. Docs (*.md), the workflow
            #    itself (which spells out the patterns) and the safety tests
            #    (which assert these markers are *absent*) legitimately
            #    mention them, so they are excluded here.
            ! grep -rn --exclude-dir=.git --exclude-dir=__pycache__ \
              --exclude="*.md" --exclude="ci.yml" --exclude="test_safety.py" \
              -E "sk-live|AKIA[0-9A-Z]{16}|-----BEGIN .*PRIVATE KEY" . \
              || (echo "secret pattern found" && exit 1)
            # 3. Example env files must stay placeholders-only.
            ! grep -E "^(BINANCE_API_KEY|BINANCE_API_SECRET|FT_API_PASSWORD)=" \
              config/.env.example deploy/compose/.env.example \
              | grep -viE "placeholder|changeme|test_|example|admin" \
              || (echo "real-looking credential in .env.example" && exit 1)
            echo "pattern fallback scan clean"
          fi

  freqai-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install package with test extras
        run: pip install -e ".[dev,ftctl,gateway]"
      - name: FreqAI smoke — small config renders a valid freqai block
        run: |
          python - <<'EOF'
          import yaml
          from common.contracts import AppConfig
          from ftctl.render.freqtrade import render_freqtrade, freqtrade_args

          data = yaml.safe_load(open("config/app.yaml.example"))
          data["strategy"]["signal_source"] = "freqai"
          data["freqai"].update({"enabled": True, "model": "LightGBMRegressor",
                                 "train_period_days": 3, "backtest_period_days": 2})
          cfg = AppConfig.model_validate(data)
          doc = render_freqtrade(cfg)
          assert doc["freqai"]["train_period_days"] == 3, doc["freqai"]
          assert "model" not in doc["freqai"], "model goes via --freqaimodel, not config.json"
          assert "--freqaimodel" in freqtrade_args(cfg), freqtrade_args(cfg)
          print("freqai smoke render OK")
          EOF
      - name: FreqAI smoke — freqai source without enabled is rejected
        run: |
          python - <<'EOF'
          import yaml
          from ftctl.loader import ConfigError, load_config

          data = yaml.safe_load(open("config/app.yaml.example"))
          data["strategy"]["signal_source"] = "freqai"
          data["freqai"]["enabled"] = False
          open("/tmp/app-freqai-invalid.yaml", "w").write(yaml.safe_dump(data))
          try:
              load_config("/tmp/app-freqai-invalid.yaml", "config/.env.example")
          except ConfigError as exc:
              print(f"correctly rejected: {exc}")
          else:
              raise SystemExit("signal_source=freqai without freqai.enabled was accepted")
          EOF
      - name: FreqAI backtesting (runs when Task 11 strategy + data exist)
        run: |
          if [ ! -f freqtrade/user_data/strategies/FreqAiStrategy.py ]; then
            echo "Task 11 FreqAiStrategy not present yet — config-level smoke above covers CI."
            exit 0
          fi
          if ! command -v freqtrade >/dev/null 2>&1; then
            echo "freqtrade binary not installed — skipping live backtest."
            exit 0
          fi
          freqtrade backtesting \
            --config freqtrade/user_data/config.json \
            --strategy FreqAiStrategy \
            --freqaimodel LightGBMRegressor \
            --timerange 20240101-20240107

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install package with test extras
        run: pip install -e ".[dev,ftctl,gateway,mcp]"
      - name: In-process dry-run stack tests
        run: pytest -q tests/e2e/test_stack_dryrun.py -m "not e2e"
      # Full docker stack (compose up + /healthz + bot ping) runs nightly
      # and on manual dispatch — too heavy for every PR.
      - name: Full docker stack dry-run (manual/nightly only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: FT_E2E_DOCKER=1 pytest -q tests/e2e/test_stack_dryrun.py -m e2e
